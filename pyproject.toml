[project]
name = "jeff"
version = "0.1.0"
description = "Typed, non-generative decisions: prefill the state once, score every question in parallel off the shared KV cache."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51,<5",
    "accelerate>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jeff = "jeff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
